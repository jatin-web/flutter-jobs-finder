<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0b1220;
        position: relative;
        color: #f8fafc;
      }

      /* Flutter-brand blue-to-cyan glow, kept as an accent rather than a full wash */
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(760px 520px at 88% 8%, rgba(19, 185, 253, 0.30), transparent 60%),
          radial-gradient(620px 460px at 6% 100%, rgba(2, 125, 253, 0.24), transparent 60%);
      }

      .grid-lines {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.15));
      }

      .accent-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: linear-gradient(90deg, #027dfd, #13b9fd);
      }

      .content {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid rgba(19, 185, 253, 0.35);
        background: rgba(19, 185, 253, 0.08);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #7fd8fe;
        margin-bottom: 36px;
      }

      .eyebrow .dart {
        width: 22px;
        height: 22px;
        display: block;
      }

      h1 {
        font-size: 84px;
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #ffffff 40%, #bfe9ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 28px;
      }

      p.subline {
        font-size: 30px;
        font-weight: 500;
        line-height: 1.4;
        color: #a9b7cc;
        max-width: 1008px;
        white-space: nowrap;
      }

      .footer {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 700;
        color: #e2e8f0;
      }

      .brand .swatch {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, #027dfd, #13b9fd);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .oss {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 24px;
        font-weight: 600;
        color: #a9b7cc;
      }

      .oss svg {
        width: 28px;
        height: 28px;
        fill: #a9b7cc;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid-lines"></div>
    <div class="accent-bar"></div>

    <div class="content">
      <div class="eyebrow">
        <svg class="dart" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4 14H11L10 22L20 9H13L13 2Z" fill="#13B9FD" />
        </svg>
        LIVE JOB BOARD
      </div>

      <h1>Flutter Jobs India</h1>
      <p class="subline">Live Flutter developer jobs in India · updated every 6 hours</p>
    </div>

    <div class="footer">
      <div class="brand">
        flutter-jobs-finder
      </div>
      <div class="oss">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        open source
      </div>
    </div>
  </body>
</html>
